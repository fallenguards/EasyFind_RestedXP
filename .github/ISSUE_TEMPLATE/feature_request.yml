name: Feature Request
description: Something the extension should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **EasyFind: RestedXP Extension**: its folder is `EasyFind_RestedXP`. Requests about the guides themselves belong with RestedXP.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do and what it would be for. A screenshot of the part of the screen helps.
    validations:
      required: true
